# Alembic configuration for Notchstave.
#
# The database URL is NOT stored here. `alembic/env.py` reads it from the
# DATABASE_URL environment variable, so the same file works for local docker,
# CI and the Hetzner box without editing (and no credential ever lands in git).
#
#   DATABASE_URL=postgresql+psycopg://notchstave:...@localhost:5432/notchstave
#   alembic upgrade head
#
# An async URL (postgresql+asyncpg://) is accepted as well — env.py detects the
# driver and runs the migration through an async engine.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# 0001_initial.py, 0002_roles_and_grants.py, ...
file_template = %%(rev)s_%%(slug)s

# Timestamps in migration files are UTC.
timezone = UTC

# sqlalchemy.url is intentionally left blank: env.py fills it from DATABASE_URL
# and raises if the variable is missing.
sqlalchemy.url =


[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
