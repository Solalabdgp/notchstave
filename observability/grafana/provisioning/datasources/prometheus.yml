# Notchstave — Grafana datasource provisioning (TZ section 7/9).
#
# Auto-provisioned so `docker compose up` produces a working dashboard with no
# manual click-through in the Grafana UI — TZ section 10 wants a real
# screenshot in the README, and that has to be reproducible by anyone who
# clones the repo, not just by whatever state one developer's browser is in.

apiVersion: 1

datasources:
  - name: Prometheus
    # Fixed uid, not Grafana's autogenerated one: the dashboard JSON in
    # ../../dashboards/notchstave.json references this uid on every panel, and
    # an autogenerated uid would only happen to match by luck on a fresh
    # volume.
    uid: notchstave-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
