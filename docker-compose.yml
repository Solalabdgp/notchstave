# Notchstave — local dev compose (TZ section 9).
#
# Postgres + Redis are real, working services this week. Prometheus/Grafana
# are commented out on purpose: Week 1 scope is "one network, one asset,
# end-to-end path works" (TZ section 11), not observability. Full prod config
# for the monitoring stack — dashboards, alert rules, retention — comes with
# Week 4 ("reliability": metrics, dashboard, alerts).
#
# Secrets: every credential below is a placeholder read from .env (see
# .env.example). Real secrets never go in this file and never go in git
# (TZ section 9). In production, secrets are delivered via systemd
# LoadCredential=/files with 600 perms, not via docker-compose env vars —
# this compose file is for local dev only.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Local dev only. TZ section 9: Postgres must not listen on a public
      # interface in production — this binding is not used past a dev laptop.
      - "127.0.0.1:5432:5432"
    volumes:
      - notchstave_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - notchstave_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Observability stack — placeholder only, not required to run this week ---
  # Full config (scrape targets for bot/api/watcher/settler/notifier, Grafana
  # dashboards/provisioning, alert rules) lands in Week 4 (TZ section 11:
  # "reliability" — pool RPC, circuit breaker, backoff, DLQ, metrics,
  # dashboard, alerts).
