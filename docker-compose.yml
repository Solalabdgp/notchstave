  #     GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
  #   volumes:
  #     - notchstave_grafana_data:/var/lib/grafana
  #   ports:
  #     - "127.0.0.1:3000:3000"

